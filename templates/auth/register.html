{% extends 'base.html' %}
{% block title %}Registro{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4">
                        <i class="bi bi-person-plus text-primary"></i> Crear Cuenta
                    </h3>
                    <form onsubmit="Auth.register(event)">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Usuario *</label>
                                <input type="text" name="username" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Email *</label>
                                <input type="email" name="email" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Nombres *</label>
                                <input type="text" name="first_name" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Apellidos *</label>
                                <input type="text" name="last_name" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">RUT</label>
                                <input type="text" name="rut" class="form-control" placeholder="12.345.678-9">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Teléfono</label>
                                <input type="text" name="phone" class="form-control" placeholder="+56912345678">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Contraseña *</label>
                                <input type="password" name="password" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Confirmar Contraseña *</label>
                                <input type="password" name="password_confirm" class="form-control" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mt-4">
                            <i class="bi bi-check-circle"></i> Registrarme
                        </button>
                    </form>
                    <hr class="my-4">
                    <p class="text-center text-muted mb-0">
                        ¿Ya tienes cuenta? <a href="/login/">Inicia sesión</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/auth.js"></script>
{% endblock %}
