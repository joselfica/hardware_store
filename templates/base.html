{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hardware Store{% endblock %} | Tienda de Componentes PC</title>

    <!-- ============================================================
         GOOGLE FONTS (preconnect + carga paralela)
         ============================================================
         - preconnect: abre la conexión TCP/TLS antes de necesitarla.
         - El <link> de la fuente se carga en paralelo al CSS, sin
           bloquear el renderizado como sí lo hacía el @import.
         ============================================================ -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

    <!-- ============================================================
         TEMA (ANTES del CSS para evitar FOUC)
         ============================================================
         theme.js se carga en el <head> y aplica los atributos
         data-theme + data-bs-theme a <html> antes de que el navegador
         pinte el primer frame. Sin esto, el usuario vería un flash
         de tema claro cuando tiene el tema oscuro guardado.
         ============================================================ -->
    <script src="{% static 'js/theme.js' %}"></script>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">

    {% block extra_css %}{% endblock %}
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- ============================================================
         NAVBAR
         ============================================================ -->
    {% include 'partials/navbar.html' %}

    <!-- ============================================================
         MENSAJES FLASH (alertas)
         ============================================================ -->
    <div class="container mt-3" id="flash-messages"></div>

    <!-- ============================================================
         CONTENIDO PRINCIPAL
         ============================================================ -->
    <main class="flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <!-- ============================================================
         FOOTER (con datos del alumno — REQUISITO DE LA EVALUACIÓN)
         ============================================================ -->
    {% include 'partials/footer.html' %}

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Cliente API + Auth (globales) -->
    <script src="{% static 'js/api.js' %}"></script>
    <script src="{% static 'js/auth.js' %}"></script>

    <!-- Animaciones sutiles globales -->
<script src="{% static 'js/animations.js' %}"></script>


    <!-- ============================================================
         INICIALIZACIÓN DEL TEMA
         ============================================================
         El tema ya se aplicó en el <head> (arriba) para evitar FOUC.
         Aquí solo inicializamos el toggle del navbar, que necesita
         que el DOM esté listo para encontrar el ícono (#theme-icon).
         ============================================================ -->
    <script>
        document.addEventListener('DOMContentLoaded', () => Theme.init());
    </script>

    <!-- Bloque para JS adicional por página (ÚNICO) -->
    {% block extra_js %}{% endblock %}
</body>
</html>
