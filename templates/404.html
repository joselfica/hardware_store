{% extends 'base.html' %}
{% block title %}Página no encontrada{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 text-center py-5">
            <div class="error-icon-wrapper mb-4">
                <i class="bi bi-cpu display-1 text-primary"></i>
            </div>
            <h1 class="display-1 fw-bold text-gradient mb-3">404</h1>
            <h3 class="mb-3">Página no encontrada</h3>
            <p class="text-muted mb-4 fs-5">
                El componente que buscas no está en nuestro catálogo
                o la ruta está mal escrita.
            </p>
            <div class="d-flex gap-2 justify-content-center flex-wrap">
                <a href="/" class="btn btn-hs-primary">
                    <i class="bi bi-house-door"></i> Volver al inicio
                </a>
                <a href="javascript:history.back()" class="btn btn-hs-outline">
                    <i class="bi bi-arrow-left"></i> Ir atrás
                </a>
            </div>
            <div class="mt-5 text-muted small">
                <i class="bi bi-info-circle"></i>
                Código de error: <code>404_NOT_FOUND</code>
            </div>
        </div>
    </div>
</div>
{% endblock %}
